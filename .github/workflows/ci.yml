name: Validate extension
on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run package
      - run: npm run verify:package
      - uses: actions/upload-artifact@v4
        with:
          name: opencode-jupyter-vsix
          path: artifacts/*.vsix
  extension-host:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - vscode: 1.90.0
            jupyter: 2024.5.0
          - vscode: stable
            jupyter: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: xvfb-run -a npm run test:host
        env:
          VSCODE_TEST_VERSION: ${{ matrix.vscode }}
          JUPYTER_TEST_VERSION: ${{ matrix.jupyter }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: host-evidence-${{ matrix.vscode }}
          path: artifacts/host-*.json
